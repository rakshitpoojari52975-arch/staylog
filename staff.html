<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Raaya Vasyam"/>
  <meta name="theme-color" content="#F5F1E8"/>
  <meta name="robots" content="noindex"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <title>Raaya Vasyam — Staff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Prata&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    /* Light only. This page is read in daylight, on one phone, by someone who
       has no menu to change it back from — so it does not follow the device.
       color-scheme:light also keeps the browser from darkening the inputs. */
    :root{
      color-scheme:light;
      --cream:#F5F1E8; --white:#FFFDF8; --surface-2:#FBF6EB;
      --border:#E7DFCE; --border-soft:#F0EADC;
      --text:#1F2420; --text-mid:#4E5449; --muted:#84806F; --light:#A9A493;
      --accent:#2F6B4F; --accent-light:#E3EFE7; --accent-line:#CFE3D7; --on-accent:#FFFDF8;
      --gold:#A8762C; --gold-light:#F6EEDD; --gold-line:#E7D5AE;
      --danger:#A63A34; --danger-light:#F8E7E3;
      --display:'Prata',Georgia,serif; --body:'Manrope',-apple-system,'Segoe UI',sans-serif;
      --radius:12px; --radius-sm:8px;
      --shadow:0 1px 2px rgba(31,36,32,.05);
    }
    html{font-size:16px;-webkit-text-size-adjust:100%;}
    body{
      font-family:var(--body); background:var(--cream); color:var(--text);
      font-size:15px; line-height:1.5; min-height:100vh;
      -webkit-font-smoothing:antialiased; overscroll-behavior:none;
    }
    #app{max-width:480px;margin:0 auto;min-height:100vh;}
    input{
      font-family:inherit; font-size:16px; width:100%; min-height:50px; padding:13px 15px;
      border:1.5px solid var(--border); border-radius:var(--radius-sm);
      background:var(--white); color:var(--text); outline:none;
    }
    input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light);}
    button{
      font-family:inherit; font-size:15px; font-weight:700; cursor:pointer;
      border:none; border-radius:var(--radius-sm); color:var(--text); background:none;
      -webkit-tap-highlight-color:transparent;
    }
    button:active{transform:scale(.98);}
    .btn{background:var(--accent);color:var(--on-accent);min-height:50px;width:100%;padding:14px;}
    .btn[disabled]{background:var(--light);}
    .btn-quiet{border:1.5px solid var(--border);color:var(--text-mid);min-height:42px;padding:10px 14px;}
    .card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
    .display{font-family:var(--display);font-weight:400;letter-spacing:-.01em;font-synthesis-weight:none;}
    .num{font-variant-numeric:tabular-nums;}
    .kicker{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
    .track{height:6px;border-radius:20px;background:var(--border);overflow:hidden;}
    .track>i{display:block;height:100%;border-radius:20px;background:var(--accent);}
    @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="cloud-config.js"></script>
  <script src="vendor/supabase.umd.js"></script>
  <script src="staff.js"></script>
</body>
</html>
